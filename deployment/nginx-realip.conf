# Used only with docker-compose.public.yml (Cloudflare Tunnel): take the visitor's address from CF-Connecting-IP,
# but only when the request comes from inside the Docker network (the tunnel container).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
