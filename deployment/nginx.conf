limit_req_zone $binary_remote_addr zone=abix_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=abix_auth:10m rate=5r/m;

# Stage 4: smoother delivery - compress text assets, send small packets (mouse/keys) immediately.
gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;
gzip_min_length 512;
tcp_nodelay on;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=abix_req burst=60 nodelay;
    client_max_body_size 16k;

    # Stage 2: the web login page and its files are public (they contain no secrets).
    # Everything that matters is behind the session cookie: /api/* and /desktop/*.
    root /usr/share/nginx/abix;
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'" always;
    }

    # API (backend runs inside the desktop container, internal network only)
    location /api/ {
        proxy_pass http://desktop:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
    # Stage 3: file upload. Large bodies are allowed ONLY here and streamed straight to the API (no buffering on disk).
    location = /api/files/upload {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://desktop:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
    # login attempts: 5 per minute per address (burst 5), on top of the lockout inside the API
    location = /api/login {
        limit_req zone=abix_auth burst=5 nodelay;
        proxy_pass http://desktop:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
    # Only Nginx may call this; it answers 200 (logged in, not locked), 401 (not logged in) or 403 (locked).
    location = /_auth {
        internal;
        proxy_pass http://desktop:8080/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /desktop { return 302 /; }
    # Stage 5: noVNC's own program files never change between logins; let the browser keep them (faster start).
    location ~ ^/desktop/(app|core|vendor)/ {
        auth_request /_auth;
        access_log off;
        rewrite ^/desktop/(.*)$ /$1 break;       # regex locations cannot strip the prefix inside proxy_pass
        proxy_pass http://desktop:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location /desktop/ {
        auth_request /_auth;
        access_log off;                      # the viewer URL carries the VNC password; do not log it
        proxy_pass http://desktop:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;                 # Stage 5: screen data goes straight through, never waits in a buffer
        proxy_request_buffering off;
        proxy_socket_keepalive on;           # keeps the connection alive on mobile networks (fewer reconnects = fewer freezes)
        gzip off;                            # the VNC stream is already compressed; compressing again only adds delay
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }
}
