[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
loglevel=info

[program:abixapi]
command=/usr/bin/python3 /usr/local/lib/abix/abix_api.py
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvnc]
environment=HOME="/home/abix",USER="abix"
command=/usr/local/bin/abix-xvnc
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfce]
environment=HOME="/home/abix",USER="abix",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-abix"
command=/usr/local/bin/abix-session-start
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vncclip]
environment=HOME="/home/abix",USER="abix",DISPLAY=":1"
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec vncconfig -nowin'
priority=25
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6081 localhost:5901
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
