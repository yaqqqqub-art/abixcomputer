[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

# X server with VNC. Listens on localhost only (inside the container).
[program:xvnc]
user=abix
environment=HOME="/home/abix",USER="abix"
command=/usr/local/bin/abix-xvnc
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Xfce desktop session
[program:xfce]
user=abix
environment=HOME="/home/abix",USER="abix",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-abix"
command=/usr/local/bin/abix-session-start
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# noVNC web client + WebSocket bridge, internal network only (Nginx is the only public entry).
[program:novnc]
user=abix
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Stage 2 API (login, session, lock, settings, power). Root inside the container; drops to user abix to run abix-ctl.
# Listens on the internal Docker network only. Nginx is the only way in.
[program:abixapi]
user=root
command=/usr/bin/python3 /usr/local/lib/abix/abix_api.py
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Stage 4: clipboard bridge. TigerVNC only exchanges clipboard text with the browser while vncconfig is running.
# Waits for the X server first; restarts itself if it ever stops.
[program:vncclip]
user=abix
environment=HOME="/home/abix",USER="abix",DISPLAY=":1"
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec vncconfig -nowin'
priority=25
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
