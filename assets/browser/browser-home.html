<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ABIX Browser</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:system-ui,"Segoe UI","Noto Sans",sans-serif;background:linear-gradient(135deg,#0b1020,#1c2a5a);color:#fff}
svg{width:84px;height:84px}h1{margin:0;font-size:1.6rem;font-weight:600}
form{width:min(560px,90vw);display:flex}input{flex:1;font:inherit;padding:14px 18px;border-radius:99px;border:0;outline:none}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.links a{color:#cfe3ff;text-decoration:none;padding:8px 14px;border:1px solid rgba(255,255,255,.25);border-radius:99px}
.links a:hover{background:rgba(255,255,255,.12)}
</style></head><body>
<svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc2ff"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs>
<rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)"/><path d="M20 44 32 18l12 26h-6l-2.4-5.6h-7.2L26 44z M30 34h4l-2-4.8z" fill="#fff"/></svg>
<h1>ABIX Browser</h1>
<form action="https://duckduckgo.com/" method="get"><input name="q" type="search" placeholder="Search the web" autofocus aria-label="Search the web"></form>
<div class="links"><a href="https://www.wikipedia.org/">Wikipedia</a><a href="https://github.com/">GitHub</a><a href="https://www.youtube.com/">YouTube</a><a href="https://mail.google.com/">Mail</a></div>
</body></html>
